version: '3.8'

services:
  memgraph:
    image: memgraph/memgraph:latest
    container_name: memgraph-autochub
    ports:
      - "7687:7687"
    volumes:
      - memgraph_data:/var/lib/memgraph
    environment:
      - MEMGRAPH_ARGS=--bolt-port=7687
    restart: unless-stopped

volumes:
  memgraph_data:
    driver: local
