<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-CHUB | Deprecation Analysis Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0c10;
            --bg-card: #161b22;
            --accent: #7c4dff;
            --accent-glow: rgba(124, 77, 255, 0.3);
            --text-main: #e6edf3;
            --text-dim: #8b949e;
            --critical: #ff5252;
            --high: #ff9100;
            --medium: #ffd740;
            --low: #448aff;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: fixed;
            top: -10%;
            right: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            z-index: -1;
            filter: blur(100px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            background: var(--glass);
            padding: 8px 16px;
            border-radius: 100px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text-dim);
            backdrop-filter: blur(10px);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
            animation: fadeInUp 1s ease-out;
        }

        .card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border);
            transition: transform 0.3s ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .card h3 {
            color: var(--text-dim);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .card .value {
            font-size: 3rem;
            font-weight: 700;
        }

        .findings-section {
            animation: fadeInUp 1.2s ease-out;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .section-header h2 {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .findings-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 12px;
        }

        .findings-table th {
            text-align: left;
            padding: 15px;
            color: var(--text-dim);
            font-weight: 400;
            font-size: 0.9rem;
        }

        .finding-row {
            background: var(--glass);
            transition: background 0.3s ease;
        }

        .finding-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .finding-row td {
            padding: 20px 15px;
            vertical-align: middle;
        }

        .finding-row td:first-child { border-radius: 12px 0 0 12px; }
        .finding-row td:last-child { border-radius: 0 12px 12px 0; }

        .severity {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .sev-critical { background: rgba(255, 82, 82, 0.15); color: var(--critical); border: 1px solid var(--critical); }
        .sev-high { background: rgba(255, 145, 0, 0.15); color: var(--high); border: 1px solid var(--high); }
        .sev-medium { background: rgba(255, 215, 64, 0.15); color: var(--medium); border: 1px solid var(--medium); }

        .file-link {
            color: var(--accent);
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
        }

        .file-link span {
            color: var(--text-dim);
            margin-left: 5px;
        }

        .snippet {
            display: block;
            background: #000;
            padding: 10px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            margin-top: 10px;
            color: #d1d5db;
            border-left: 3px solid var(--accent);
        }

        .chub-docs-container {
            margin-top: 60px;
            background: linear-gradient(135deg, rgba(124, 77, 255, 0.05) 0%, transparent 100%);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid var(--border);
        }

        .chub-docs-container h2 {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .doc-content {
            font-size: 1rem;
            color: var(--text-dim);
        }

        .fade-in { animation: fadeIn 0.5s ease-in; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .empty-state {
            text-align: center;
            padding: 100px 20px;
            background: var(--glass);
            border-radius: 20px;
            border: 2px dashed var(--border);
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: var(--text-dim);
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="container">
        <header>
            <div class="logo">
                <h1>Auto-CHUB.</h1>
            </div>
            <div class="status-badge" id="scan-info">
                Analyzing Workspace...
            </div>
        </header>

        <div class="summary-grid">
            <div class="card">
                <h3>Files Scanned</h3>
                <div class="value" id="count-files">0</div>
            </div>
            <div class="card">
                <h3>Total Findings</h3>
                <div class="value" id="count-findings" style="color: var(--accent)">0</div>
            </div>
            <div class="card">
                <h3>Critical Issues</h3>
                <div class="value" id="count-critical" style="color: var(--critical)">0</div>
            </div>
        </div>

        <section class="findings-section" id="findings-section">
            <div class="section-header">
                <div style="width: 12px; height: 12px; border-radius: 50%; background: var(--accent)"></div>
                <h2>Detailed Findings</h2>
            </div>
            
            <div id="findings-container">
                <!-- Data will be injected here -->
                <div class="empty-state">
                    <h3>No Deprecations Detected</h3>
                    <p>Your codebase is fully optimized according to the current rule set.</p>
                </div>
            </div>
        </section>

        <section class="chub-docs-container">
            <h2>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-book-open"><path d="M2 3h6a4 4 0 0 1 4 4v14a4 4 0 0 0-4-4H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a4 4 0 0 1 4-4h6z"></path></svg>
                Context Hub Documentation
            </h2>
            <div class="doc-content" id="chub-content">
                Fetching latest documentation from Andrew Ng's GitHub...
            </div>
        </section>
    </div>

    <script>
        const data = {{FINDINGS_JSON}};
        const docContent = `{{DOC_CONTENT}}`;

        function init() {
            document.getElementById('count-files').textContent = data.filesAnalyzed.length;
            document.getElementById('count-findings').textContent = data.findings.length;
            document.getElementById('scan-info').textContent = `Analysis Complete • ${new Date(data.timestamp).toLocaleTimeString()}`;

            const criticalCount = data.findings.filter(f => f.severity === 'critical').length;
            document.getElementById('count-critical').textContent = criticalCount;

            if (data.findings.length > 0) {
                renderFindings();
            }

            renderDoc();
        }

        function renderFindings() {
            const container = document.getElementById('findings-container');
            let html = `
                <table class="findings-table">
                    <thead>
                        <tr>
                            <th>Severity</th>
                            <th>API / Issue</th>
                            <th>Location</th>
                            <th>Suggested Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.findings.forEach(f => {
                html += `
                    <tr class="finding-row">
                        <td><span class="severity sev-${f.severity}">${f.severity}</span></td>
                        <td>
                            <strong>${f.title}</strong>
                            <code class="snippet">${f.snippet}</code>
                        </td>
                        <td>
                            <a href="#" class="file-link">${f.filePath}<span>:L${f.line}</span></a>
                        </td>
                        <td>
                            <div style="color: var(--text-main); font-weight: 600">Replace with: ${f.replacement}</div>
                            <div style="font-size: 0.85rem; color: var(--text-dim); margin-top: 5px">${f.guidance}</div>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function renderDoc() {
            const container = document.getElementById('chub-content');
            // Basic markdown-ish formatting for display
            const formattedDoc = docContent
                .replace(/^#\s+(.*)/gm, '<h3 style="color: #fff; margin: 20px 0 10px 0">$1</h3>')
                .replace(/^##\s+(.*)/gm, '<h4 style="color: #fff; margin: 15px 0 8px 0">$1</h4>')
                .replace(/`(.*?)`/g, '<code style="background: #000; padding: 2px 6px; border-radius: 4px; font-family: mono">$1</code>')
                .replace(/\n\n/g, '</p><p style="margin-bottom: 15px">');
            
            container.innerHTML = `<p>${formattedDoc}</p>`;
        }

        init();
    </script>
</body>
</html>
